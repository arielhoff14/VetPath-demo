name: Verify live regional searches
on:
  push:
    branches: [feat/vetpath-demo]
    paths: [".github/workflows/verify-live-locations.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the regional directory deployment
        run: |
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch('https://vetpathdemo.up.railway.app/api/providers');
            if (response.ok) {
              const providers = await response.json();
              if (providers.length >= 29 && providers.some(p => p.postal_code === '95131')) process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('The regional directory deployment is not ready');
          JS
      - name: Check public city and ZIP searches
        env:
          BASE_URL: https://vetpathdemo.up.railway.app
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test tests/e2e/locations.spec.ts --grep 'unfiltered directory'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-regional-search-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
