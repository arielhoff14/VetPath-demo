name: Verify live regional searches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public city and ZIP searches
        env:
          BASE_URL: https://vetpath-web-production.up.railway.app
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test tests/e2e/locations.spec.ts --grep 'unfiltered directory'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-regional-search-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
